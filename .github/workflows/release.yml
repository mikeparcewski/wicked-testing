name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: write

jobs:
  # Gate: verify CHANGELOG has an entry for the version being released.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: CHANGELOG entry check
        run: node scripts/dev/release-check.mjs "${GITHUB_REF_NAME#v}"

  release:
    needs: preflight
    uses: mikeparcewski/wicked-ci/.github/workflows/node-release.yml@d8c9b0a14fb91c2d13f5da0468eeeff983c27e5a # v1.1.2
    with:
      package_name: wicked-testing
      test_cmd: 'npm test && npm run test:unit'
      enable_sync_pr: true
    secrets: inherit
